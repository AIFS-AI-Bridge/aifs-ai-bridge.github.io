<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Team — AIBridge</title>
    <meta
      name="description"
      content="The instructors and founders behind AIBridge."

    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />

  <body>
    <nav class="nav">
      <div class="nav__inner">
        <a class="brand" href="index.html" aria-label="AIBridge home">

        <div class="nav__links">
          <a href="team.html">Our Team</a>
          <a href="curriculum.html">Curriculum</a>

          class="nav__toggle"
          type="button"
          aria-label="Toggle menu"
          aria-expanded="false"

          <span></span>
        </button>
      </div>

      <div class="wrap"><h1>Our Team</h1></div>

      <section class="section section--tight">

              </div>
              <div class="person__name">Xin Liu</div>
              <div class="person__role">Instructor</div>
            </article>

            <article class="person reveal">
              <div
                class="person__photo"
                data-photo="assets/img/team/huda_syed_mustafa.jpg"
                data-photo-alt="Huda Syed Mustafa"

                <span class="person__monogram">HM</span>
              </div>
              <div class="person__name">Huda Syed Mustafa</div>
              <div class="person__role">Coordinator</div>
            </article>

            <article class="person reveal">
              <div
                class="person__photo"
                data-photo="assets/img/team/fanyu_meng.jpg"

                <span class="person__monogram">FM</span>
              </div>
              <div class="person__name">Fanyu Meng</div>

            <article class="person reveal">
              <div
                class="person__photo"
                data-photo="assets/img/team/ibna_kowsar.jpg"

            <article class="person reveal">

                class="person__photo"
                data-photo="assets/img/team/anna_harmon.jpg"

                <span class="person__monogram">AH</span>
              </div>
              <div class="person__name">Anna Harmon</div>
              <div class="person__role">TA</div>
            </article>

            <article class="person person--tba reveal">
              <div
                class="person__photo"
                data-photo="assets/img/team/stephen_villanueva.jpg"
                data-photo-alt="Stephen Villanueva"
              >
                <span class="person__monogram">SV</span>
              </div>
              <div class="person__name">Stephen Villanueva</div>
              <div class="person__role">TA</div>

        </div>

    <footer class="footer">
      <div class="wrap footer__inner">
        <span>© <span data-year>2026</span> AIBridge M</span>
        <a
          class="aifs"
          href="https://aifs.ucdavis.edu"
          target="_blank"
          rel="noopener"
        >
          <img
            src="assets/img/aifs-logo.png"
            alt="AI Institute for Next Generation Food Systems"
            width="1080"
            height="540"
          />
        </a>
      </div>
